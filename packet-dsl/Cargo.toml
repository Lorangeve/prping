[package]
name = "packet-dsl"
version = "0.1.0"
edition = "2024"
description = "声明式网络包构建 DSL（.pkt）：解析 + 语义分析 → 结构化 IR，由宿主序列化/发送"
license = "MIT"

[dependencies]
chumsky = { version = "1.0.0-alpha.8", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
serde_json = "1"
