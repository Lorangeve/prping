[target.'cfg(target_os = "linux")']
runner = ".cargo/run-with-cap.sh"

# MSVC 静态链接 CRT 与 C++ 运行库（/MT：libcmt + libcpmt 等）：
# 产物不依赖 vcruntime140.dll / msvcp140.dll / ucrtbase.dll，
# 无 VC++ Redistributable 的机器（如 Win7）也能直接运行。
# rustc 默认 MSVC 走动态 CRT；开启 crt-static 后链接器改为静态库。
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.x86_64-win7-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.i686-win7-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
