help:
  group:
    mode: "Mode (auto-detected)"
    test: "Test control"
    output: "Output"
    network: "Network"
    server: "Server"
    other: "Other"
  options:
    server: "Server listening address and port"
    bandwidth: "Bandwidth test mode"
    count: "Number of sends/receives (default: infinite). Append 's' for seconds e.g. '10s'"
    interval: "Interval in seconds (0 = fast ping)"
    size: "Request/payload size (e.g. 64, 8k, 1m). Triggers latency test when port present."
    lang: "Set language (e.g. en-US, zh-CN). Default: auto-detect from system."
    udp: "UDP mode (default is TCP)"
    quiet: "Suppress per-ping output"
    histogram: "Histogram: bucket count (e.g. 20) or comma-separated thresholds in ms (e.g. 1,5,10,50)"
    warmup: "Warmup iterations (default 4)"
    parallel: "Number of parallel connections"
    v4: "Force IPv4"
    v6: "Force IPv6"
    json: "Output machine-readable JSON statistics"
    receive: "Receive from server instead of sending (download direction; used with -l latency or -b bandwidth)"
    pretty: "Render graphs with ploot (Unicode/Braille)"
    graph: "Print latency timeline graph (combine with -p for ploot rendering)"
    version: "Show version"
    help_icmp: "ICMP ping usage"
    help_tcp: "TCP ping usage"
    help_latency: "Latency test usage"
    help_bandwidth: "Bandwidth test usage"
    help_udp: "UDP ping usage"
    help_server: "Server usage"

  overview: |-
    prping — ping, latency, bandwidth measurement utility

    Implements ICMP ping, TCP ping, UDP ping, UDP/TCP latency,
    and UDP/TCP bandwidth measurement.

  usage: "prping [OPTIONS] <HOST[:PORT]>   (or: -s <ADDR:PORT> for server)"
  mode_guide: |-
    Modes (auto-detected): host → ICMP | host:port → TCP | -u → UDP | -l SIZE → Latency | -b → Bandwidth | -s → Server
    Detailed help: --help-icmp / --help-tcp / --help-udp / --help-latency / --help-bandwidth / --help-server

  usage_line: "Help: prping -h | --help [--help-icmp|--help-tcp|--help-udp|--help-latency|--help-bandwidth|--help-server]\n   -h, --help            Show all options.\n   --help-icmp           ICMP ping usage.\n   --help-tcp            TCP ping usage.\n   --help-udp            UDP ping usage.\n   --help-latency        Latency test usage.\n   --help-bandwidth      Bandwidth test usage.\n   --help-server         Server usage."

  icmp: |-
    ICMP ping:
      prping [-n count] [-i sec] [-l size] [-g] [-p] [-H N|t1,t2,...] [-w warmup] [-q] [-4] [-6] [--json] [--lang en-US|zh-CN] host

      Options:
        -n N / -n Ns    Iterations, or seconds with 's' suffix (default: infinite)
        -i S            Interval in seconds (0 = fast ping; clamped to 1ms min)
        -l SIZE         Payload size (e.g. 64, 8k, 1m)
        -g              Print latency timeline graph (default: off)
        -p              Render graphs with ploot (Unicode/Braille)
        -H N|t1,t2,...  Histogram: bucket count, or thresholds in ms (e.g. 1,5,10,50)
        -w N            Warmup iterations (default 4)
        -q              Suppress per-ping output
        -4 / -6         Force IPv4 / IPv6
        --json          Machine-readable JSON statistics
        --lang          Language (en-US | zh-CN), default auto-detect

      Examples:
        prping -n 10 8.8.8.8
            -n 10       send 10 pings, then stop
        prping -n 5s -i 0.2 -gp 8.8.8.8
            -n 5s       stop after 5 seconds
            -i 0.2      0.2s interval between pings
            -g          print the latency timeline graph
            -p          render graphs with ploot
        prping -l 64 -H "1,5,10,50" 8.8.8.8
            -l 64       64-byte payload
            -H "1,5,10,50"  histogram buckets split at 1/5/10/50 ms

      Requires root or cap_net_raw on Linux.

  tcp: |-
    TCP ping:
      prping [-n count] [-i sec] [-g] [-p] [-H N|t1,t2,...] [-w warmup] [-q] [-4] [-6] [--json] [--lang en-US|zh-CN] host:port

      Options: same as ICMP ping (see --help-icmp), but a target port is required.
        -l SIZE  turns this into a latency test (see --help-latency)
        -r       ignored for plain TCP ping

      Examples:
        prping -n 30 -i 0.1 -gp 192.168.1.1:22
            -n 30       send 30 connection attempts
            -i 0.1      0.1s interval
            -g          print the latency timeline graph
            -p          render graphs with ploot
        prping -n 10s server:80
            -n 10s      run for 10 seconds, then stop
        prping -n 100 -gp server:8080        (with server: prping -s 0.0.0.0:8080)
            -n 100      connect 100 times
            -g -p       ploot-rendered timeline graph

  udp: |-
    UDP ping:
      prping -u [-n count] [-i sec] [-g] [-p] [-H N|t1,t2,...] [-w warmup] [-q] [-4] [-6] [--json] [--lang en-US|zh-CN] host:port

      Options:
        -u           UDP mode (required)
        -n N / -n Ns Iterations, or seconds with 's' suffix (default: infinite)
        -i S         Interval in seconds (0 = fast ping)
        -g           Print latency timeline graph
        -p           Render graphs with ploot
        -H N|t1,t2   Histogram: bucket count, or thresholds in ms
        -w N         Warmup iterations (default 4)
        -q           Suppress per-ping output
        -4 / -6      Force IPv4 / IPv6
        --json       Machine-readable JSON statistics

      Tests UDP port reachability and round-trip latency.
      Replies are validated by an embedded sequence number.

      Examples:
        prping -u -n 10 192.168.1.1:53
            -u          UDP mode
            -n 10       send 10 probes
        prping -u -n 5s -gp 192.168.1.1:53
            -n 5s       stop after 5 seconds
            -g -p       ploot-rendered timeline graph
        prping -u -n 100 server:8080        (with server: prping -s 0.0.0.0:8080)
            -n 100      send 100 probes (server echoes)

  latency: |-
    TCP/UDP latency test (echo round-trip):
      server: prping [-4] [-6] -s address:port
      client: prping -l size[k|m] -n count[s] [-u] [-r] [-g] [-p] [-H N|t1,t2,...] [-w warmup] [-4] [-6] [--json] [--lang en-US|zh-CN] host:port

      Options:
        -l SIZE      Request payload size (required; e.g. 64, 8k, 1m)
        -n N / -n Ns Iterations, or seconds with 's' suffix (default: 100)
        -u           UDP mode (default TCP)
        -r           Receive mode: server sends data, client measures download latency
        -g           Print latency timeline graph
        -p           Render graphs with ploot
        -H N|t1,t2   Histogram: bucket count, or thresholds in ms
        -w N         Warmup iterations (default 4)
        -4 / -6      Force IPv4 / IPv6
        --json       Machine-readable JSON statistics

      Examples:
        (server: prping -s 0.0.0.0:8080)
        prping -l 64 -n 100 -gp server:8080
            -l 64       64-byte request payload
            -n 100      100 round-trips
            -g -p       ploot-rendered timeline graph
        prping -l 64 -n 10s -u -r server:8080
            -l 64       64-byte payload
            -n 10s      run for 10 seconds
            -u          UDP mode
            -r          receive mode (server sends, client receives)

  bandwidth: |-
    TCP/UDP bandwidth test:
      server: prping [-4] [-6] -s address:port
      client: prping -b -l size[k|m] -n count[s] [-P N] [-u] [-r] [-w warmup] [-H N|t1,t2,...] [-4] [-6] [--json] [--lang en-US|zh-CN] host:port

      Options:
        -b           Bandwidth mode (required)
        -l SIZE      Packet size (default 8k; e.g. 8k, 1m)
        -n N / -n Ns Packets, or seconds with 's' suffix (default: 10000)
        -P N         Parallel TCP connections (TCP only; ignored with -u)
        -u           UDP mode (default TCP)
        -r           Receive mode (measure download direction)
        -w N         Warmup packets (default 4)
        -H N|t1,t2   Histogram of per-packet send time
        -4 / -6      Force IPv4 / IPv6
        --json       JSON: {"type":"bandwidth","bytes":...,"secs":...,"mbps":...}

      Examples:
        (server: prping -s 0.0.0.0:8080)
        prping -b -l 8k -n 20000 -P 4 server:8080
            -b          bandwidth mode
            -l 8k       8 KiB packets
            -n 20000    20000 packets total
            -P 4        4 parallel TCP connections
        prping -b -l 8k -n 10s -u -r server:8080
            -l 8k       8 KiB packets
            -n 10s      run for 10 seconds
            -u          UDP mode
            -r          receive mode (download direction)

  server: |-
    Server (serves latency & bandwidth clients):
      prping [-4] [-6] -s address:port

      Protocol on one port (TCP + UDP):
        TCP echo      Every packet echoed back (single 0xFF byte triggers stream mode)
        UDP echo      Every datagram echoed back
        UDP trigger   [0xFF,0xFF,size(2B BE),count(4B BE)] -> send count datagrams of size bytes

      Prints per-connection lines and an aggregate summary on Ctrl+C.
      Concurrent TCP connection cap: 1024.

      Examples:
        prping -s 0.0.0.0:8080
            -s 0.0.0.0:8080  listen on all interfaces, TCP+UDP port 8080
        prping -s [::]:8080 -6
            -s [::]:8080    IPv6 wildcard listener
            -6             force IPv6
        client: prping -b -l 8k -n 10000 -P 4 host:8080
            -b -l 8k -n 10000 -P 4   bandwidth test against the server

  examples: |-
    Examples:
      prping 8.8.8.8                            ICMP ping (infinite)
      prping -n 10 -gp 8.8.8.8                  ICMP, 10 pings, ploot graph
      prping 192.168.1.1:22                     TCP ping
      prping -u 8.8.8.8:53                      UDP ping
      prping -l 64 -n 100 server:8080            Latency test (TCP, 64 bytes)
      prping -b -l 8k -n 10000 -P 4 server:8080  Bandwidth (TCP, 8KB, 4 conns)
      prping -b -l 8k -n 10s -u -r server:8080   Bandwidth (UDP download, 10s)
      prping -s 0.0.0.0:8080                    Start server
      prping --help-icmp                        ICMP details (also --help-tcp/udp/latency/bandwidth/server)