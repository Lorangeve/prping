_version: 1

icmp:
  pinging: "正在 Ping %{addr}，数据大小 %{size} 字节:"
  iterations: "%{total} 次迭代 (预热 %{warmup}) ping 测试:"
  duration: "%{secs} 秒时长 (预热 %{warmup}) ping 测试:"

tcp:
  connect_to: "TCP 连接到 %{addr}:%{port}:"
  iterations: "%{total} 次迭代 (预热 %{warmup}) ping 测试:"
  duration: "%{secs} 秒时长 (预热 %{warmup}) ping 测试:"

common:
  resolving: "解析 %{host} -> %{ip}"
  reply_from: "来自 "
  bytes: "字节="
  time: "时间="
  ttl: "TTL="
  warmup: "(预热)"
  connecting_to: "连接到 "
  from: "从"
  timeout: "请求超时。"
  connect_failed: "连接失败: %{error}"
  dest_unreachable: "目标主机不可达。"
  ttl_expired: "传输中 TTL 超时。"

stats:
  sent_received: "发送 = %{sent}，接收 = %{received}，丢失 = %{lost} (%{pct}% 丢失),"
  min_max_avg: "最小 = %{min}ms，最大 = %{max}ms，平均 = %{avg}ms，标准差 = %{stddev}ms"
  percentiles: "P50 = %{p50}ms, P95 = %{p95}ms, P99 = %{p99}ms"
  latency_dist: "延迟分布:"

bandwidth:
  warmup_complete: "预热完成: %{count} 次发送"
  tcp_test: "TCP 带宽测试:"
  udp_test: "UDP 带宽测试:"
  sent_bytes: "已发送 = %{bytes} 字节，耗时 %{secs}秒"
  bandwidth: "带宽 = %{mbps} Mbps"

server:
  bandwidth_listening: "带宽测试服务端正在监听 %{addr}"
  connect_tag: "连接 "
  recv_tag: "接收 "
  summary: "服务端汇总: %{conns} 个连接，共 %{bytes} 字节，耗时 %{secs}秒（平均 %{mbps} Mbps）"

errors:
  raw_socket: "无法创建 raw socket: %{error}。需要 root 权限或 cap_net_raw"
  cannot_resolve: "无法解析主机: %{host}"
  invalid_bind: "无效的绑定地址: %{addr}。格式: host:port"
  host_port_required: "需要 HOST[:PORT]，或 -s ADDR:PORT 启动服务端"
  udp_requires_port: "UDP 模式需要端口: HOST:PORT"
  bandwidth_requires_port: "带宽测试需要 HOST:PORT"
  invalid_count: "无效的次数: %{value}（使用 N 或 Ns）"
  udp_size_clamped: "UDP 负载已截断为 %{max} 字节（请求 %{size}）"
  interval_min: "间隔已截断为最小 1ms（请求 %{value}s）"
  parallel_udp_ignored: "UDP 模式忽略 -P（UDP 带宽为单连接）"
  receive_ignored_ping: "普通 ping 模式忽略 -r（延迟/带宽测试请用 -l/-b）"
  invalid_ipv6: "无效的 IPv6 格式: [host] 或 [host]:port"

help:
  options:
    server: "服务端监听地址和端口"
    bandwidth: "带宽测试模式"
    count: "发送/接收次数（默认无限）。追加 's' 表示秒数（如 '10s'）"
    interval: "间隔秒数（0 = 快速 ping）"
    size: "请求/负载大小（如 64, 8k, 1m）。有端口时触发延迟测试。"
    lang: "设置语言（如 en, zh-CN）。默认从系统自动检测。"
    udp: "UDP 模式（默认 TCP）"
    quiet: "不输出每次测试结果"
    histogram: "直方图: 桶数（如 20）或逗号分隔的毫秒阈值（如 1,5,10,50）"
    warmup: "预热迭代次数（默认 4）"
    parallel: "并发连接数"
    v4: "强制使用 IPv4"
    v6: "强制使用 IPv6"
    json: "输出机器可读的 JSON 统计"
    help_icmp: "ICMP ping 用法"
    help_tcp: "TCP ping 用法"
    help_latency: "延迟测试用法"
    help_bandwidth: "带宽测试用法"

  overview: |-
    prping — ping, 延迟, 带宽测量工具

    实现 ICMP ping, TCP ping, UDP ping, TCP/UDP 延迟测试,
    以及 TCP/UDP 带宽测试。

  usage_line: "帮助: prping -h | --help [--help-icmp|--help-tcp|--help-latency|--help-bandwidth]\n   -h, --help            显示全部选项。\n   --help-icmp           ICMP ping 用法。\n   --help-tcp            TCP ping 用法。\n   --help-latency        延迟测试用法。\n   --help-bandwidth      带宽测试用法。"

  icmp: |-
    ICMP ping:
      prping [-n 次数] [-i 间隔] [-l 大小] [-q] [-w 预热] [--histogram 桶数] [-4] [-6] 主机

      -n           Ping 次数，追加 's' 表示秒数（如 '10s'）
      -i           间隔秒数（0 = 快速 ping）
      -l           请求大小，追加 'k' 表示千字节，'m' 表示兆字节
      -q           不输出每次测试结果
      -w           预热迭代次数（默认 4）
      --histogram  打印直方图（默认 20 个桶）
      -4           强制使用 IPv4
      -6           强制使用 IPv6

  tcp: |-
    TCP ping:
      prping [-n 次数] [-i 间隔] [-q] [-w 预热] [--histogram 桶数] [-4] [-6] 主机:端口

      测试 TCP 端口连通性和连接延迟。
      选项同 ICMP ping，但必须指定目标端口。

  latency: |-
    TCP/UDP 延迟测试:
      服务端: prping [-4] [-6] -s 地址:端口
      客户端: prping -l 大小[k|m] -n 次数[s] [-u] [-w 预热] [--histogram 桶数] [-4] [-6] 主机:端口

      -l           请求大小（必选）。追加 'k' 表示千字节，'m' 表示兆字节
      -n           发送/接收次数，追加 's' 表示秒数（如 '10s'）
      -u           UDP 模式（默认 TCP）
      -w           预热迭代次数（默认 5）
      --histogram  打印直方图（默认 20 个桶）
      -4           强制使用 IPv4
      -6           强制使用 IPv6
      -s           服务端监听地址和端口

      服务端同时处理延迟和带宽测试，Ctrl+C 终止。

  bandwidth: |-
    TCP/UDP 带宽测试:
      服务端: prping [-4] [-6] -s 地址:端口
      客户端: prping -b -l 大小[k|m] -n 次数[s] [-u] [-P 并发] [-w 预热] [--histogram 桶数]
                     [-4] [-6] 主机:端口

      -b           启用带宽测试模式
      -l           请求大小，追加 'k' 表示千字节，'m' 表示兆字节
      -n           发送/接收次数，追加 's' 表示秒数（如 '10s'）
      -u           UDP 模式（默认 TCP）
      -P           并发连接数（默认 4）
      -w           预热迭代次数（默认 2x CPU 核心数）
      --histogram  打印直方图（默认 20 个桶）
      -4           强制使用 IPv4
      -6           强制使用 IPv6
      -s           服务端监听地址和端口

      服务端同时处理延迟和带宽测试，Ctrl+C 终止。

  examples: |-
    示例:
      prping 8.8.8.8                      ICMP ping
      prping www.baidu.com:80              TCP ping
      prping -u 8.8.8.8:53                 UDP ping
      prping -l 64 -n 100 server:8080      延迟测试（TCP，64 字节）
      prping -b -l 8k -n 10000 server:8080 带宽测试（TCP，8KB）
      prping -s 0.0.0.0:8080              启动服务端
