  invalid_bind: "无效的绑定地址: %{addr}。格式: host:port"
  host_port_required: "需要 HOST[:PORT]，或 -s ADDR:PORT 启动服务端"
  udp_requires_port: "UDP 模式需要端口: HOST:PORT"
  bandwidth_requires_port: "带宽测试需要 HOST:PORT"
  invalid_count: "无效的次数: %{value}（使用 N 或 Ns）"
  udp_size_clamped: "UDP 负载已截断为 %{max} 字节（请求 %{size}）"
  interval_min: "间隔已截断为最小 1ms（请求 %{value}s）"
  parallel_udp_ignored: "UDP 模式忽略 -P（UDP 带宽为单连接）"
  receive_ignored_ping: "普通 ping 模式忽略 -r（延迟/带宽测试请用 -l/-b）"
  invalid_ipv6: "无效的 IPv6 格式: [host] 或 [host]:port"

help:
  options:
    server: "服务端监听地址和端口"
    bandwidth: "带宽测试模式"
    count: "发送/接收次数（默认无限）。追加 's' 表示秒数（如 '10s'）"
    interval: "间隔秒数（0 = 快速 ping）"
    size: "请求/负载大小（如 64, 8k, 1m）。有端口时触发延迟测试。"
    lang: "设置语言（如 en-US, zh-CN）。默认从系统自动检测。"
    udp: "UDP 模式（默认 TCP）"
    quiet: "不输出每次测试结果"
    histogram: "直方图: 桶数（如 20）或逗号分隔的毫秒阈值（如 1,5,10,50）"
    warmup: "预热迭代次数（默认 4）"
    parallel: "并发连接数"
    v4: "强制使用 IPv4"
    v6: "强制使用 IPv6"
    json: "输出机器可读的 JSON 统计"
    help_icmp: "ICMP ping 用法"
    help_tcp: "TCP ping 用法"
    help_latency: "延迟测试用法"
    help_bandwidth: "带宽测试用法"
    help_udp: "UDP ping 用法"
    help_server: "服务端用法"

  overview: |-
    prping — ping, 延迟, 带宽测量工具

    实现 ICMP ping, TCP ping, UDP ping, TCP/UDP 延迟测试,
    以及 TCP/UDP 带宽测试。

  usage_line: "帮助: prping -h | --help [--help-icmp|--help-tcp|--help-udp|--help-latency|--help-bandwidth|--help-server]\n   -h, --help            显示全部选项。\n   --help-icmp           ICMP ping 用法。\n   --help-tcp            TCP ping 用法。\n   --help-udp            UDP ping 用法。\n   --help-latency        延迟测试用法。\n   --help-bandwidth      带宽测试用法。\n   --help-server         服务端用法。"

  icmp: |-
    ICMP ping:
      prping [-n 次数] [-i 秒] [-l 大小] [-g] [-p] [-H N|t1,t2,...] [-w 预热] [-q] [-4] [-6] [--json] [--lang en-US|zh-CN] 主机

      参数:
        -n N / -n Ns    次数，或追加 's' 表示秒数（默认无限）
        -i S            间隔秒数（0 = 快速；下限 1ms）
        -l SIZE         负载大小（如 64, 8k, 1m）
        -g              显示延迟时间线图（默认关闭）
        -p              用 ploot 渲染图表（Unicode/Braille）
        -H N|t1,t2,...  直方图：桶数，或逗号分隔毫秒阈值（如 1,5,10,50）
        -w N            预热迭代次数（默认 4）
        -q              不输出每次测试结果
        -4 / -6         强制 IPv4 / IPv6
        --json          输出机器可读 JSON 统计
        --lang          语言（en-US | zh-CN），默认自动检测

      示例:
        prping 8.8.8.8                         ICMP ping（无限，Ctrl+C 停止）
        prping -n 10 8.8.8.8                    ping 10 次
        prping -n 5s -i 0.2 -gp 8.8.8.8         跑 5 秒、0.2s 间隔、ploot 图
        prping -l 64 -H "1,5,10,50" 8.8.8.8      64 字节负载 + 阈值直方图

      Linux 下需要 root 或 cap_net_raw。

  tcp: |-
    TCP ping:
      prping [-n 次数] [-i 秒] [-g] [-p] [-H N|t1,t2,...] [-w 预热] [-q] [-4] [-6] [--json] [--lang en-US|zh-CN] 主机:端口

      参数同 ICMP ping（见 --help-icmp），但必须指定目标端口。
        -l SIZE  会进入延迟测试（见 --help-latency）
        -r       普通 TCP ping 忽略

      示例:
        prping 192.168.1.1:22                   TCP ping（无限）
        prping -n 30 -i 0.1 -gp 192.168.1.1:22   30 次、ploot 图
        prping -n 10s server:80                 持续 10 秒

      配合服务端（回显）:
        服务端: prping -s 0.0.0.0:8080
        客户端: prping -n 100 -gp server:8080

  udp: |-
    UDP ping:
      prping -u [-n 次数] [-i 秒] [-g] [-p] [-H N|t1,t2,...] [-w 预热] [-q] [-4] [-6] [--json] [--lang en-US|zh-CN] 主机:端口

      参数:
        -u           UDP 模式（必选）
        -n N / -n Ns 次数，或追加 's' 表示秒数（默认无限）
        -i S         间隔秒数（0 = 快速）
        -g           显示延迟时间线图
        -p           用 ploot 渲染图表
        -H N|t1,t2   直方图：桶数，或毫秒阈值
        -w N         预热迭代次数（默认 4）
        -q           不输出每次测试结果
        -4 / -6      强制 IPv4 / IPv6
        --json       输出机器可读 JSON 统计

      测试 UDP 端口可达性和往返延迟，回包按内嵌序号校验。

      示例:
        prping -u -n 10 192.168.1.1:53           UDP ping 10 次
        prping -u -n 5s -gp 192.168.1.1:53       UDP ping 5 秒 + ploot 图

      配合服务端（回显）:
        服务端: prping -s 0.0.0.0:8080
        客户端: prping -u -n 100 -gp server:8080

  latency: |-
    TCP/UDP 延迟测试（echo 往返）:
      服务端: prping [-4] [-6] -s 地址:端口
      客户端: prping -l 大小[k|m] -n 次数[s] [-u] [-r] [-g] [-p] [-H N|t1,t2,...] [-w 预热] [-4] [-6] [--json] [--lang en-US|zh-CN] 主机:端口

      参数:
        -l SIZE      请求负载大小（必选；如 64, 8k, 1m）
        -n N / -n Ns 次数，或追加 's' 表示秒数（默认 100）
        -u           UDP 模式（默认 TCP）
        -r           接收模式：服务端回送数据，客户端测下载方向延迟
        -g           显示延迟时间线图
        -p           用 ploot 渲染图表
        -H N|t1,t2   直方图：桶数，或毫秒阈值
        -w N         预热迭代次数（默认 4）
        -4 / -6      强制 IPv4 / IPv6
        --json       输出机器可读 JSON 统计

      示例:
        服务端: prping -s 0.0.0.0:8080
        客户端: prping -l 64 -n 100 -gp server:8080        TCP 延迟，64 字节负载
        客户端: prping -l 64 -n 10s -u -r server:8080       UDP 接收模式延迟，10 秒

  bandwidth: |-
    TCP/UDP 带宽测试:
      服务端: prping [-4] [-6] -s 地址:端口
      客户端: prping -b -l 大小[k|m] -n 次数[s] [-P N] [-u] [-r] [-w 预热] [-H N|t1,t2,...] [-4] [-6] [--json] [--lang en-US|zh-CN] 主机:端口

      参数:
        -b           带宽模式（必选）
        -l SIZE      包大小（默认 8k；如 8k, 1m）
        -n N / -n Ns 包数，或追加 's' 表示秒数（默认 10000）
        -P N         并行 TCP 连接数（仅 TCP；UDP 模式忽略）
        -u           UDP 模式（默认 TCP）
        -r           接收模式（测下载方向）
        -w N         预热包数（默认 4）
        -H N|t1,t2   单包发送耗时直方图
        -4 / -6      强制 IPv4 / IPv6
        --json       JSON: {"type":"bandwidth","bytes":...,"secs":...,"mbps":...}

      示例:
        服务端: prping -s 0.0.0.0:8080
        客户端: prping -b -l 8k -n 20000 -P 4 server:8080   TCP 上行，4 并发
        客户端: prping -b -l 8k -n 10s -u -r server:8080     UDP 下行，10 秒

  server: |-
    服务端（同时服务延迟/带宽客户端）:
      prping [-4] [-6] -s 地址:端口

      同一端口上的协议（TCP + UDP）:
        TCP 回显    每个收到的包原样回送（单个 0xFF 字节触发流模式）
        UDP 回显    每个数据报原样回送
        UDP 触发    [0xFF,0xFF,size(2B BE),count(4B BE)] -> 回送 count 个 size 字节数据报

      Ctrl+C 退出时打印每连接日志与聚合汇总。TCP 并发连接上限 1024。

      示例:
        prping -s 0.0.0.0:8080                    监听所有接口
        prping -s 0.0.0.0:8080 -6                  强制 IPv6 监听
        客户端: prping -b -l 8k -n 10000 -P 4 主机:8080

  examples: |-
    示例:
      prping 8.8.8.8                      ICMP ping
      prping www.baidu.com:80              TCP ping
      prping -u 8.8.8.8:53                 UDP ping
      prping -l 64 -n 100 server:8080      延迟测试（TCP，64 字节）
      prping -b -l 8k -n 10000 server:8080 带宽测试（TCP，8KB）
      prping -s 0.0.0.0:8080              启动服务端
