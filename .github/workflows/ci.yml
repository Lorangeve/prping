name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Docs
        run: cargo doc --no-deps

      # --all-targets 兜底：lib 单元 + bin + 两个集成测试文件 + doc 测试
      - name: All tests
        run: cargo test --all-targets

  bench:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build release
        run: cargo build --release
      # 基准非门禁：失败只告警不拦合并
      - name: Run benchmark
        continue-on-error: true
        run: bash scripts/bench.sh target/release/prping

  win7-build:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install nightly + rust-src
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - name: Install cargo-xwin
        run: cargo install cargo-xwin
      # XWIN_ARCH 统一 x86,x86_64：cargo-xwin 默认只下载 x86_64+aarch64 库，
      # 且 DONE 标记只记录最近一次架构，不统一指定会反复重下载
      - name: Build Win7 MSVC x64 (build-std)
        run: XWIN_ARCH=x86,x86_64 cargo +nightly xwin build -Z build-std --target x86_64-win7-windows-msvc --release
      - name: Build Win7 MSVC x86 (build-std)
        run: XWIN_ARCH=x86,x86_64 cargo +nightly xwin build -Z build-std --target i686-win7-windows-msvc --release
      - name: Upload artifact (x64)
        uses: actions/upload-artifact@v4
        with:
          name: prping-win7-x64
          path: target/x86_64-win7-windows-msvc/release/prping.exe
      - name: Upload artifact (x86)
        uses: actions/upload-artifact@v4
        with:
          name: prping-win7-x86
          path: target/i686-win7-windows-msvc/release/prping.exe
