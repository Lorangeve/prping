name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install just
        uses: extractions/setup-just@v3

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # 质量门禁统一走 justfile 配方（justfile 为唯一构建/检查入口）
      - name: Format check
        run: just fmt-check

      # lint = 原语文档同步门禁（doc-sync-check）+ clippy 零警告
      - name: Lint
        run: just lint

      - name: Docs
        run: just doc

      # --workspace --all-targets：core 单元 + bin + 集成测试 + doc 测试
      - name: All tests
        run: just test

      # Linux 可选 libpcap（`--features pcap`）路径：`server -v` 抓包的多设备路径
      # + `packet --raw` 注入，编译 + clippy 零警告
      - name: Linux pcap feature check
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcap-dev
          just check-pcap

      # Web 内嵌 feature（rust-embed）路径：内嵌模式 lookup/503 提示编译 + clippy
      # （首次会经 build.rs 构建前端，runner 自带 node/npm）
      - name: Web embed feature check
        if: matrix.os == 'ubuntu-latest'
        run: just check-web-embed

  bench:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install just
        uses: extractions/setup-just@v3
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build release
        run: just build-release
      # 基准非门禁：失败只告警不拦合并
      - name: Run benchmark
        continue-on-error: true
        run: just bench

  win7-build:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install just
        uses: extractions/setup-just@v3
      - name: Install nightly + rust-src
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - name: Install cargo-xwin
        run: cargo install cargo-xwin
      # 配方内置 XWIN_ARCH=x86,x86_64 与 Npcap SDK 自动拉取（windows-deps → fetch-npcap-sdk）
      - name: Build Win7 MSVC x64 (build-std)
        run: just build-win7
      - name: Build Win7 MSVC x86 (build-std)
        run: just build-win7-32
      - name: Upload artifact (x64)
        uses: actions/upload-artifact@v4
        with:
          name: prping-win7-x64
          path: target/x86_64-win7-windows-msvc/release/prping.exe
      - name: Upload artifact (x86)
        uses: actions/upload-artifact@v4
        with:
          name: prping-win7-x86
          path: target/i686-win7-windows-msvc/release/prping.exe
