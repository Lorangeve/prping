name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Docs
        run: cargo doc --no-deps

      # --all-targets 兜底：lib 单元 + bin + 两个集成测试文件 + doc 测试
      - name: All tests
        run: cargo test --all-targets

  bench:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build release
        run: cargo build --release
      # 基准非门禁：失败只告警不拦合并
      - name: Run benchmark
        continue-on-error: true
        run: bash scripts/bench.sh target/release/prping
