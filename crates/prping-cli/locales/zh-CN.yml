---
_version: 1
icmp:
  pinging: '正在 Ping %{addr}，数据大小 %{size} 字节:'
  iterations: "%{total} 次迭代 (预热 %{warmup}) ping 测试:"
  duration: "%{secs} 秒时长 (预热 %{warmup}) ping 测试:"
tcp:
  connect_to: 'TCP 连接到 %{addr}:%{port}:'
  iterations: "%{total} 次迭代 (预热 %{warmup}) ping 测试:"
  duration: "%{secs} 秒时长 (预热 %{warmup}) ping 测试:"
udp:
  pinging: 'UDP ping 目标 %{addr}:%{port}，负载 %{size} 字节:'
  iterations: "%{total} 次迭代 (预热 %{warmup}) ping 测试:"
  duration: "%{secs} 秒时长 (预热 %{warmup}) ping 测试:"
  echo_hint: '提示: 目标端口需有回显服务（如 prping -s ADDR:PORT）才会回包'
common:
  resolving: 解析 %{host} -> %{ip}
  reply_from: '来自 '
  bytes: 字节=
  time: 时间=
  ttl: TTL=
  warmup: "(预热)"
  connecting_to: '连接到 '
  from: 从
  timeout: 请求超时。
  connect_failed: '连接失败: %{error}'
  dest_unreachable: 目标主机不可达。
  ttl_expired: 传输中 TTL 超时。
stats:
  ok: ok（可过）
  frag: 分片需要
  fail: 无回复/超限
  unreachable: 目标不可达
  ttl_exceeded: TTL 超时
  timeout_note: payload=%{size} 探测两次超时（%{timeout}s），按超限处理
  summary: 路径 MTU = %{mtu} 字节（最大不分片载荷 %{payload} 字节，目标 %{host}）
  frag_needed_mtu: 途中 Fragmentation Needed 报回 MTU = %{mtu}
  sent_received: 发送 = %{sent}，接收 = %{received}，丢失 = %{lost} (%{pct}% 丢失),
  min_max_avg: 最小 = %{min}ms，最大 = %{max}ms，平均 = %{avg}ms，标准差 = %{stddev}ms
  percentiles: P50 = %{p50}ms, P95 = %{p95}ms, P99 = %{p99}ms
  jitter: 抖动 = %{avg}ms（最大 %{max}ms）
  latency_dist: '延迟分布:'
bandwidth:
  warmup_complete: '预热完成: %{count} 次发送'
  tcp_test: 'TCP 带宽测试:'
  udp_test: 'UDP 带宽测试:'
  sent_bytes: 已发送 = %{bytes} 字节，耗时 %{secs}秒
  received_bytes: 已接收 = %{bytes} 字节，耗时 %{secs}秒
  bytes_human: '（%{bytes}）'
  connections: '并发连接 = %{count}'
  bandwidth: 带宽 = %{mbps} Mbps
  progress:
    packets: "%{done}/%{total} 包（%{done_bytes}/%{total_bytes}）  %{mbps} Mbps"
    bytes: "%{done_bytes}/%{total_bytes}  %{mbps} Mbps"
    time: "%{bytes}  %{mbps} Mbps"
server:
  bandwidth_listening: prping 测试服务端正在监听 %{addr}
  connect_tag: '连接 '
  sent_tag: '发送 '
  recv_tag: '接收 '
  udp_trigger: 'UDP 接收模式触发：来自 '
  summary: '服务端汇总: %{conns} 个连接，接收 %{bytes} 字节、发送 %{sent} 字节，耗时 %{secs}秒（平均 %{mbps} Mbps）'
  verbose_hint: '详细模式：将为每个收到的数据包打印反解层栈与 hexdump'
trace:
  tracing: '正在跟踪到 %{host} (%{addr}) 的路由，最多 %{hops} 跳:'
  reached: 到达目标 %{host}，共 %{hops} 跳。
  not_reached: 未在 %{hops} 跳内到达目标 %{host}（目标可能屏蔽 ICMP，或路径更长——可用 -m 增加跳数）。
engine:
  note_fuzz: 'note: fuzz 模式——未填字段已随机化'
  note_wait_reply: 'note: 等待匹配应答最多 %{secs}s'
  note_wait_recipe: 'note: 等待应答最多 %{secs}s（每步 wait: 覆盖）'
  note_bare_export: 'note: 裸层导出（无 TCP/UDP 传输、也无 eth/ipv4/ipv6 外层）无法发送，跳过——仅作 --eng 展示'
  note_raw_fallback: 'note: 无 TCP/UDP 传输——改用原始套接字发送完整包'
  note_raw_only: 'note: 无 TCP/UDP 传输层——本包只能经 raw 模式发送完整包（--raw / 配方 raw: true），payload 模式无法提取载荷'
  auto_raw_upgrade: '提示：此配方/文件的所有导出包均无 TCP/UDP 传输层（如 ICMP/ARP），自动升级为 --raw 模式（需 root/cap_net_raw）'
  note_fakeip_target: 'note: 目标 %{ip} 是代理 fake-ip（198.18.0.0/15）——eth 原始帧绕过代理直发不可达；用 examples/network_icmp_bare/（裸 IP 走内核路由/代理）或关代理直连'
  note_fakeip_src: 'note: src 自动填充为 %{ip}（疑似代理 fake-ip 网关）——eth 原始帧绕过代理直发，真实网关会丢弃；用 examples/network_icmp_bare/（裸 IP 走内核路由/代理）'
  note_src_filled: 'note: src 自动填充 → %{ip}'
  note_src_unfillable: 'note: src=0.0.0.0/:: 且无法自动填充本地地址——回包可能路由不回来；用 --params src=<本机 IP>'
  note_arp_miss: 'note: 无法解析 %{next_hop} 的 MAC（ARP 缓存未命中）——用广播地址发送，回包可能无法到达'
  note_iface_mac: 'note: 获取接口 %{if_index} 的 MAC 失败（%{error}）——用全零源 MAC，回包可能无法路由回来'
errors:
  raw_socket: '无法创建 raw socket: %{error}。需要 root 权限或 cap_net_raw'
  cannot_resolve: '无法解析主机: %{host}'
  invalid_bind: '无效的绑定地址: %{addr}。格式: host:port'
  host_port_required: 需要 HOST[:PORT]
  conflict_eng_pkg: "--eng 与 --pkt 互斥"
  lsp_requires_eng: "--lsp 只能与 --eng 一起使用"
  raw_requires_pkg: "--raw 只能与 --pkt 一起使用"
  iface_requires_raw: "--iface 只能与 --pkt --raw 一起使用"
  listen_conflict: '持续监听（--wait 无值）不能与 --fuzz/--out 组合（持续接收并回显；--raw = 链路层监听，可配合 --iface 选网卡）'
  listen_raw_no_target: '--wait --raw（链路层监听）不需要 ADDR:PORT（帧按帧内 MAC/IP 决定去向）'
  params_requires_eng_pkg: "--params 只能与 --eng 或 --pkt 一起使用"
  params_format: "--params 需要 k=v 格式: `%{value}`"
  global_requires_eng_pkg: "--global 只能与 --eng 或 --pkt 一起使用"
  global_format: "--global 需要 k=v 格式: `%{value}`"
  wait_requires_pkg: "--wait 只能与 --pkt 一起使用"
  fuzz_requires_pkg: "--fuzz 只能与 --pkt 一起使用"
  out_requires_pkg: "--out 只能与 --pkt 一起使用"
  eng_sub_conflict: "--ls / --hex / --pcap 互斥"
  eng_sub_requires_eng: "--ls / --hex / --pcap 只能与 --eng 一起使用"
  eng_sub_conflict_lsp: "--ls / --hex / --pcap 不能与 --lsp 一起使用"
  eng_sub_no_file: "--ls / --hex / --pcap 不接受文件参数"
  eng_json_sub_conflict: "--json 仅对 FILE.pkt/.pktl 分析模式有效（不能与 --ls/--hex/--pcap/--lsp 组合）"
  pkt_json_listen_conflict: "--json 不能与持续监听（--wait 无值）组合"

  pkt_count_zero: '--count 必须 ≥ 1（每个包重复发送次数）'
  listen_count_conflict: '持续监听（--wait 无值）不支持 --count > 1（监听不发包）'
  to_pkt_requires_pcap: "--to-pkt 只能与 --pcap 一起使用"
  structured_requires_to_pkt: "--structured 只能与 --to-pkt 一起使用"
  skip_limit_requires_to_pkt: "--skip / --limit 只能与 --to-pkt 一起使用"
  threads_requires_to_pkt: "--threads 只能与 --to-pkt 一起使用"
  conflict_engine_mode: "%{flag} 不能与以下参数同时使用: %{opts}"
  eng_requires_file: "--eng 需要 .pkt 文件（或 --eng --lsp）"
  eng_lsp_no_file: "--lsp 不接受文件参数"
  pktl_not_found: '找不到 pktl `%{arg}`（先找 `%{direct}`，再找同名文件夹内的 `%{folder}`）'
  pkg_requires_target: "--pkt 需要目标 HOST:PORT"
  pkg_requires_port: "--pkt 需要目标端口（HOST:PORT）。提示：如果此配方不含 TCP/UDP 层（如 ICMP/ARP），请加 --raw：prping packet FILE HOST --raw"
  udp_requires_port: 'UDP 模式需要端口: HOST:PORT'
  bandwidth_requires_port: 带宽测试需要 HOST:PORT
  invalid_count: '无效的次数: %{value}（使用 N 或 Ns）'
  invalid_histogram: '无效的直方图参数: %{value}（使用 N 或 t1,t2,...）'
  invalid_port: '无效的端口: %{value}'
  ping_port_no_size: 'ping %{target} 带端口时不能使用 -l（负载大小 -l 仅对无端口的 ICMP ping 有效；带端口请用 latency -l 或 bandwidth -l）'
  parallel_zero: '--parallel 必须 >= 1'
  count_zero_bandwidth: '带宽测试次数（-n）必须 >= 1（缺省 1000；时长模式用 -n Ns）'
  udp_size_clamped: UDP 负载已截断为 %{max} 字节（请求 %{size}）
  interval_min: 间隔已截断为最小 1ms（请求 %{value}s）
  parallel_udp_ignored: UDP 模式忽略 --parallel（UDP 带宽为单连接）
  parallel_ignored: 本模式忽略 --parallel（仅带宽测试支持）
  receive_ignored_ping: 普通 ping 模式忽略 -r（延迟/带宽测试请用 -l/-b）
  invalid_ipv6: '无效的 IPv6 格式: [host] 或 [host]:port'
  conflict_source_server: "-s（--source）不能与服务端模式一起使用"
  conflict_source_engine: "-s（--source）不能与引擎/包模式（--eng/--pkt）一起使用"
  mtu_ipv4_only: MTU 探测目前仅支持 IPv4（IPv6 路径 MTU 需 ICMPv6 Packet Too Big，暂未支持）
  mtu_no_reply: 无回显：ICMP 可能被防火墙丢弃（%{target}）
  conflict_mtu_mode: "--mtu 不能与其他模式参数一起使用：%{opts}"
  mtu_requires_no_port: "MTU 探测不接受端口: prping ping -m HOST"
  conflict_mtu_histogram: "--mtu 不支持 -H 直方图"
  conflict_trace_mode: "-t 不能与其他模式/测试/输出参数一起使用：%{opts}"
  trace_requires_no_port: "UDP 路由跟踪不接受端口: prping trace --udp HOST（目标端口从 33434 起自动递增）"
  tcp_trace_requires_port: "TCP 路由跟踪需要端口: prping trace HOST:PORT"
  trace_udp_tcp_conflict: "TCP 与 UDP 路由跟踪不能同时请求"
  trace_no_local_addr: 无法确定本地源地址（UDP 路由探测失败）
  max_hops_requires_trace: "-m 只能与 trace（路由跟踪）一起使用"
  no_dns_requires_trace: "-d 只能与 trace（路由跟踪）一起使用"
  resolve_failed: 无法解析 %{host}
  engine_mode_required: 未指定模式：请用 --eng / --pkt / --ls / --hex / --pcap
  help_pkg_not_found: |-
    未找到匹配的章节：「%{section}」
    用 `prping document` 查看目录：
  help_pkg_ambiguous: 命中 %{count} 个章节，请用编号或更精确的标题：
  help_pkg_toc_hint: 目录（用 `prping document <编号或标题>` 跳转）：
  conflict_v4_v6: "-4 与 -6 不能同时使用"
  conflict_server_target: "-s（服务端模式）不能与目标 HOST[:PORT] 同时使用"
  conflict_server_mode: "-s（服务端模式）不能与客户端测试参数同时使用: %{opts}"
  conflict_json_pretty: "--json 与 -p/--pretty 不能同时使用"
  conflict_json_graph: "--json 与 -g/--graph 不能同时使用"
  conflict_json_histogram: "--json 与 -H/--histogram 不能同时使用"
  pkt_json_summary_conflict: "--json 与 --summary 不能同时使用（--summary 会输出人读文本，破坏 JSONL 契约）"
  receive_requires_latency_bandwidth: "-r 需要配合 -b（带宽测试）或 -l + HOST:PORT（延迟测试）使用"
  capture_all_requires_verbose: "--capture-all 需要配合 --verbose 使用"
  filter_requires_capture_all: "--filter 需要配合 --capture-all 使用"
  lib_requires_eng_pkg: "--lib 需要 --eng 或 --pkt"
  ambiguous_prefix: "子命令前缀 '%{token}' 有歧义：可匹配 %{candidates}"
  legacy_host_hint: "无法识别的子命令 '%{host}' — prping 现在使用子命令；试试: prping ping %{host}（迁移指南: prping document）"
  latency_requires_port: latency 需要 HOST:PORT
cmd:
  ping: 主机 ping（ICMP；带端口为 TCP，-u 为 UDP，-m 为 MTU 探测）
  latency: 延迟测试（TCP/UDP 回显往返）
  bandwidth: 带宽测试（TCP/UDP 吞吐）
  server: 启动测试服务端（服务 latency/bandwidth 客户端）
  trace: 路由跟踪（ICMP echo；带端口自动 TCP SYN，-u 用 UDP）
  engine: 包引擎：分析 .pkt/.pktl、LSP、--ls/--hex/--pcap
  packet: 从 .pkt/.pktl 文件构建并发送网络包
  document: 显示完整使用手册或跳转到指定章节
  web: 内嵌 Web 编辑器：packet DSL（CodeMirror + LSP），实时层栈/HEX 预览
help:
  group:
    mode: 模式（自动识别）
    test: 测试控制
    output: 输出
    network: 网络
    server: 服务端
    other: 其他
    engine: 引擎 / 包构建
  options:
    server: 服务端监听地址和端口
    bandwidth: 带宽测试模式
    count: 发送/接收次数（默认无限）。追加 's' 表示秒数（如 '10s'）
    interval: 间隔秒数（默认 1，0 = 快速 ping）
    size: 请求/负载大小（如 64, 8k, 1m）。有端口时触发延迟测试。
    lang: 设置语言（如 en-US, zh-CN）。默认从系统自动检测。
    udp: UDP 模式（默认 TCP）
    mtu: MTU 探测：ICMP DF + 变长载荷二分
    traceroute: 路由跟踪（traceroute）：ICMP echo + 递增 TTL 逐跳探测路径
    trace_udp: UDP 路由跟踪（经典 traceroute：33434 起递增端口；目标回端口不可达即到达）
    max_hops: 最大跳数（默认 30）
    no_dns: 跳过反向 DNS 解析
    eng: 引擎模式：分析 .pkt 文件并精美输出（加 --lsp 启动语言服务器）
    lsp: 为 .pkt 文件启动 LSP 语言服务器（配合 --eng；JSON-RPC over stdio）
    pkg: 从 .pkt 文件构建网络包并发送到 HOST:PORT（可省略，省略时按包内 dst/dport 推导；加 --raw 用原始套接字）
    raw: 用原始套接字发送完整序列化包（Linux 需 root/cap_net_raw；Windows 需安装 Npcap）
    iface: 原始以太网帧使用的网卡（默认 lo）
    params: 传给 .pkt 脚本的运行时参数（-p k=v,k2=v2；脚本内用 params("name") 读取）
    global: >-
      注入配方全局存储的键值（k=v,k2=v2；脚本内用 global("name") 读取；配合 .pktl
      配方时作为 global: 声明的初始值，-g 覆盖 init）
    pkt_count: 每个包重复发送次数（配方步骤 `count:` 覆盖；--wait 无值不支持）
    wait: >-
      等待/监听模式：`--wait SECS` = 发送后等一个匹配应答（对标 scapy sr1），打印 RTT 并反解展示；
      `--wait`（无值）或负数（如 `--wait=-2`）= 无限等待/持续监听（服务端，命中回显/按应答模板应答，Ctrl+C 退出）
    fuzz: 发送前把未填字段全部随机化（对标 scapy fuzz()，配合 --pkt）
    out: 把构建的包存成 pcap 文件（对标 scapy wrpcap，配合 --pkt）
    summary: 摘要模式：只打印一行结果（包数、目标、发送/失败数），隐藏逐包详情
    ls: 列出全部内置原语与库 proto 的字段表和自动行为，分页显示（配合 --eng）
    hex: 反解并展示十六进制字符串对应的包（配合 --eng）
    pcap: 读取 pcap 文件并逐条反解展示（配合 --eng）
    to_pkt: 把 pcap 逐条转码为 .pkt/.pktl（配合 --pcap；缺省无损字节级）
    structured: 转码用语义结构化（配合 --to-pkt；缺省无损字节级）
    skip: 转码跳过前 N 条记录（配合 --to-pkt）
    limit: 转码最多转换 N 条记录（配合 --to-pkt）
    threads: 转码解析/渲染并发线程数（0 = 自动，记录数≥1024 时按 CPU 并行；1 = 单线程）
    lib: pkglang 库目录（可多次；引擎/包子命令，排在默认 eng_lib 之后）
    quiet: 不输出每次测试结果
    histogram: '直方图: 桶数（如 20）或逗号分隔的毫秒阈值（如 1,5,10,50）'
    warmup: 预热迭代次数（默认 4）
    parallel: 并发连接数（默认 1）
    v4: 强制使用 IPv4
    v6: 强制使用 IPv6
    source: 源地址或网卡（Linux 网卡名 → IPv4 地址）
    json: 输出机器可读的 JSON 统计
    receive: 接收模式：测下载方向（配合 -l 延迟或 -b 带宽测试使用）
    pretty: 用 ploot 渲染图表（Unicode/Braille）
    graph: 显示延迟时间线图（配合 -p 用 ploot 渲染）
    verbose: 详细模式：打印每个收到的数据包的解析详情（反解层栈 + hexdump）
    capture_all: 抓取并显示所有可见帧（ARP/ICMP/广播/出向），而不只是发往监听端口的流量（需 -v）
    capture_filter: 只显示匹配该 tcpdump 风格表达式的帧（需 -a）：arp/icmp/tcp/udp/ip/ip6、port N、host IP、and/or/not、括号——另支持 eng_lib 可反解协议（如 dns/http/quic_initial）。如 "arp or icmp"、"tcp port 53"、"dns"
    version: 显示版本号
    help_pkg: 使用手册（分页）；document 章节标题 跳转（编号或标题）
    web_addr: '监听地址（默认 127.0.0.1，仅回环）'
    web_port: 'TCP 端口（默认自动分配空闲端口）'
    web_open: '启动后自动打开浏览器'
  usage_ping: 'prping ping [选项] <HOST[:PORT]>'
  usage_latency: 'prping latency [选项] <HOST:PORT>'
  usage_bandwidth: 'prping bandwidth [选项] <HOST:PORT>'
  usage_server: 'prping server <ADDR:PORT>'
  usage_trace: 'prping trace [选项] <HOST[:PORT]>'
  usage_engine: 'prping engine [选项] [<FILE.pkt>]'
  usage_packet: 'prping packet [选项] <FILE.pkt> [<HOST[:PORT]>]'
  usage_document: 'prping document [章节]'
  footer_ping: |-
    示例:
      prping ping 8.8.8.8                  ICMP ping（无限）
      prping ping 192.168.1.1:22           TCP ping
      prping ping -u 192.168.1.1:53        UDP ping
      prping ping -m 8.8.8.8               MTU 探测
  footer_latency: |-
    示例:
      prping latency 192.168.1.1:9000
      prping latency -u -r 192.168.1.1:9000   UDP 下行延迟
  footer_bandwidth: |-
    示例:
      prping bandwidth -l 8k --parallel 4 192.168.1.1:9000
      prping bandwidth -u -r 192.168.1.1:9000  UDP 下行吞吐
  footer_server: |-
    示例:
      prping server 0.0.0.0:9000
      prping server -a -v 0.0.0.0:9000  显示所有可见帧（ARP/ICMP/广播/出向）
  footer_trace: |-
    示例:
      prping trace 8.8.8.8                   ICMP echo 路由跟踪
      prping trace -m 60 8.8.8.8
      prping trace 8.8.8.8:443               TCP SYN 路由跟踪（带端口自动启用，ICMP 被过滤时可用）
      prping trace --udp 8.8.8.8             UDP 路由跟踪（经典 traceroute，33434 起递增端口）
  footer_engine: |-
    示例:
      prping engine file.pkt        分析包脚本
      prping engine --lsp           语言服务器
      prping engine --ls            列出内置原语
  footer_packet: |-
    示例:
      prping packet file.pkt 192.168.1.1:9000
      prping packet --raw --wait 2 file.pkt 8.8.8.8
      prping packet --summary file.pkt 192.168.1.1:9000
      prping packet arp_request.pkt --raw   # 链路层帧（ARP 等）：目标可省略
  footer_document: |-
    示例:
      prping document                  完整手册（分页）
      prping document 17               跳转第 17 章（路由跟踪）
      prping document mtu              跳转 MTU 相关章节
  usage_web: 'prping web [--addr ADDR] [--port N] [--open] [--lib PATH]'
  footer_web: |-
    在 127.0.0.1 上伺服 Web 编辑器（默认仅回环）：
    CodeMirror 编辑 packet DSL（经引擎 LSP 提供诊断/补全/悬停）、
    实时层栈 + HEX 预览，以及 eng_lib 协议库只读浏览。
    前端资源默认从二进制目录/启动目录的 UI/ 文件夹读取（just build-web 生成）；
    cargo build -p prping --features web-embed 可内嵌进二进制（单文件分发）。

    示例:
      prping web                       启动并打印 URL（端口自动分配）
      prping web --open                启动并打开浏览器
      prping web --port 9000 --open    固定端口
      prping web --lib ./mylib --open  附加包库目录
  overview: |-
    prping — ping, 延迟, 带宽测量工具

    子命令: ping（ICMP/TCP/UDP/MTU 探测）、latency（延迟）、bandwidth（带宽）、
    server（服务端）、trace（路由跟踪）、engine（包分析）与 packet（发包）。
  usage: 'prping 子命令 [选项] ...   （完整手册: prping document）'
  mode_guide: |-
    子命令可用任意唯一前缀缩写（如 `prping e FILE.pkt` → engine）。
    详细用法: `prping 子命令 --help` — 完整手册: `prping document`。
  usage_line: |-
    帮助: prping 子命令 --help   （prping --help 列出全部子命令）
       ping        ICMP ping / TCP ping（带端口）/ UDP ping（-u）/ MTU 探测（-M）
       latency     回显往返延迟测试（TCP/UDP）
       bandwidth   TCP/UDP 吞吐测试
       server      启动测试服务端（服务 latency/bandwidth）
       trace       路由跟踪（ICMP echo + 递增 TTL）
       engine      包引擎：分析 .pkt/.pktl、LSP、--ls/--hex/--pcap
       packet      从 .pkt/.pktl 构建并发送网络包
       web         内嵌 Web 编辑器（CodeMirror + LSP）
    示例:
      prping ping 8.8.8.8                      ICMP ping（无限）
      prping ping -n 10 -gp 8.8.8.8            ICMP，10 次，ploot 图
      prping ping 192.168.1.1:22               TCP ping
      prping ping -u 8.8.8.8:53                UDP ping
      prping ping -m 8.8.8.8                   MTU 探测
      prping latency -l 64 -n 100 server:8080  延迟测试（TCP，64 字节）
      prping bandwidth -l 8k -n 10000 --parallel 4 server:8080  带宽（TCP，8KB，4 并发）
      prping bandwidth -l 8k -n 10s -u -r server:8080  带宽（UDP 下行，10 秒）
      prping server 0.0.0.0:8080              启动服务端
      prping trace 8.8.8.8                    路由跟踪
      prping engine file.pkt                  分析包脚本
      prping packet file.pkt 192.168.1.1:9000 构建并发送网络包
      prping web --open                        Web 编辑器（自动打开浏览器）
      prping web --open                        Web 编辑器（自动打开浏览器）
