[package]
name = "prping"
version = "0.1.0"
edition = "2024"
description = "跨平台 psping 复刻 CLI"
license = "MIT"

[[bin]]
name = "prping"
path = "src/main.rs"

[features]
# 透传 prping-core 的 web-embed（rust-embed 内嵌 Web 前端；默认不嵌入，
# 运行期读二进制目录/启动目录的 UI/ 文件夹）。
# 用法：cargo build -p prping --features web-embed（workspace 根需包名限定）
web-embed = ["prping-core/web-embed"]

# 编译期把 assets/images/icon.ico 嵌进 Windows exe 资源（见 build.rs）。
# 不用 [target.'cfg(windows)'.build-dependencies]：其 cfg 匹配的是 host，
# Linux/macOS 交叉编译 Windows 时 build.rs 会因缺依赖而无法编译；
# winresource 本身极小，全平台无条件编译，build.rs 内按 CARGO_CFG_WINDOWS 分支。
[build-dependencies]
winresource = "0.1"

[dependencies]
prping-core = { path = "../prping-core" }
packet-dsl = { path = "../packet-dsl" }
bpaf = "0.9"
anyhow = "1"
rust-i18n = "3"
libc = "0.2"
smol = "2"
