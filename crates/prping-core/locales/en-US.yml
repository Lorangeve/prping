  parse_extract_no_name: 'extract item is missing `name:`'
  parse_extract_no_from: 'extract item `%{name}` is missing `from:`'
  parse_kv_syntax: 'expected `key: value`, got `%{s}`'
  parse_kv_empty_key: 'the key cannot be empty'
  parse_nonempty: '`%{what}` cannot be empty'
  parse_global_name_missing: 'global item `name:` is missing the name'
