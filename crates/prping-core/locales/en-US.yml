  parse_global_dup: 'global `%{name}` declared twice'
  parse_pkg_renamed: 'step key `pkg:` was renamed to `packet:` — write `- packet: FILE`'
  parse_step_syntax: 'step item syntax error: `%{rest}` (expected `- packet: FILE` or a bare filename)'
  parse_step_no_path: 'step is missing the .pkt file path'
  parse_list_outside: 'list item outside of global:/recipe:'
