  jitter: Jitter = %{avg}ms (max %{max}ms)
  latency_dist: 'Latency distribution:'
bandwidth:
  warmup_complete: 'warmup complete: %{count} sends'
  tcp_test: 'TCP Bandwidth test:'
  udp_test: 'UDP Bandwidth test:'
  sent_bytes: Sent = %{bytes} bytes in %{secs}s
  received_bytes: Received = %{bytes} bytes in %{secs}s
  bytes_human: '(%{bytes})'
  connections: 'Connections = %{count}'
  bandwidth: Bandwidth = %{mbps} Mbps
  udp_send_error: 'UDP send failed'
  conn_error: 'connection failed'
  conn_failures: '%{n} connection(s) failed — results are partial'
  progress:
    packets: "%{done}/%{total} pkts (%{done_bytes}/%{total_bytes})  %{mbps} Mbps"
    bytes: "%{done_bytes}/%{total_bytes}  %{mbps} Mbps"
    time: "%{bytes}  %{mbps} Mbps"
server:
  bandwidth_listening: prping test server listening on %{addr}
  connect_tag: 'connect '
  sent_tag: 'sent '
  recv_tag: 'recv '
  udp_trigger: 'UDP receive-mode trigger from '
  summary: 'server summary: %{conns} connections, %{bytes} bytes received, %{sent} bytes sent in %{secs}s (avg %{mbps} Mbps)'
  verbose_hint: 'verbose mode: packet dissection will be printed for each received packet'
  verbose_dissect_unavailable: 'proto registry is empty — captured frames will only show as hexdump, layer dissection unavailable'
  verbose_capture_active: 'raw packet capture active on %{devs}'
  capture_all_active: 'full-frame capture: showing all visible frames (ARP/ICMP/broadcast/outgoing), not just traffic to this port'
  capture_filter_active: 'capture filter: %{filter}'
  verbose_capture_note: 'raw packet capture unavailable (%{reason}); showing payload-level dissection only'
  capture_iface_all: 'all interfaces'
  capture_unsupported: 'raw packet capture is not supported on this platform (Linux AF_PACKET / Windows Npcap)'
