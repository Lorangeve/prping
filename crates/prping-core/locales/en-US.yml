  parse_init_inline_conflict: 'global `%{name}` already has an inline init (`- %{name}=...`); cannot add an `init:` line'
  parse_option_after_step: 'option line must follow a `- packet:` step'
  parse_extract_only: 'extract items only support name/from/as, got `%{other}`'
  parse_wait_value: '`wait` needs no value (infinite wait) or seconds (a number), got `%{val}`'
