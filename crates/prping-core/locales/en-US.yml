  recipe_no_field: 'recipe line %{line}: layer %{layer} has no field %{field}'
  recipe_not_numeric: 'recipe line %{line}: field %{layer}.%{field} is not numeric (%{val}); use as: str / bytes'
  recipe_expr_fail: 'recipe line %{line}: `from` expression evaluation failed: %{err}'
  recipe_src_label_sent: 'sent packet'
  recipe_src_label_reply: 'reply'
  recipe_as_convert_fail: 'recipe line %{line}: `as` conversion for `%{name}` failed: %{msg} (original value: %{val})'
  recipe_as_int: 'need an integer (Int/Hex)'
  recipe_as_hex: 'need a non-negative integer (Int/Hex)'
  recipe_as_str: 'need a string or integer'
  recipe_as_bytes: 'to convert a number to bytes, wrap it in the expression with primitives like be16()/u8()'
