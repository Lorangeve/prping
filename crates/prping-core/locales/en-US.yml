  time: time=
  ttl: TTL=
  warmup: "(warmup)"
  connecting_to: 'Connecting to '
  from: 'from '
  timeout: Request timed out.
  send_failed: 'send failed'
  connect_failed: 'connect failed: %{error}'
  dest_unreachable: Destination Host Unreachable.
  ttl_expired: TTL expired in transit.
stats:
  ok: ok (fits)
  frag: fragmentation needed
  fail: no reply / too large
  unreachable: destination unreachable
  ttl_exceeded: TTL exceeded
  timeout_note: payload=%{size} timed out twice (%{timeout}s), treated as too large
