  listen_raw_bad_iface: 'invalid interface name: `%{iface}`'
  listen_raw_no_devices: 'no usable capture devices (need root/admin, or Npcap installed)'
  listen_raw_threads_exited: 'all capture threads exited (device error), listen stopped'
  note_bare_export: 'note: bare layer export (no TCP/UDP transport, no eth/ipv4/ipv6 outer layer) cannot be sent, skipped — --eng display only'
  note_bare_export_short: 'note: bare layer export, skipped'
  note_raw_fallback: 'note: no TCP/UDP transport — sending full packet via raw sockets (%{hint})'
  note_raw_fallback_short: 'note: no TCP/UDP transport — raw fallback'
  note_raw_only: 'note: no TCP/UDP transport layer — full packet can only be sent via raw mode (--raw / recipe raw: true); payload mode cannot extract a payload'
