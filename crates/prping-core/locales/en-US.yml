  listen_ignored: '- ignored %{bytes} B from %{peer}'
  listen_done: 'listen finished: %{matched}/%{total} datagrams matched'
  listen_no_port: 'cannot derive listen port from the packet (need a udp/tcp dport or an explicit ADDR:PORT)'
  listen_multi_dport: 'packet exports use different destination ports (%{ports}); specify ADDR:PORT explicitly'
  listen_send_phase_failed: 'send phase failed — continuing to listen (waiting for the peer): %{error}'
  listen_bind_fail: 'failed to bind %{addr}: %{err}'
  listen_raw_binding: 'raw listen on %{iface} — match frames against the sniffer rule and print details (Ctrl+C to stop; root/Npcap required)'
  listen_raw_matched: '✓ matched %{frame} B'
  listen_raw_done: 'raw listen finished: %{matched}/%{total} frames matched'
  listen_recipe_udp: 'listening on %{addr}'
  listen_recipe_raw: 'link-layer listen on %{iface}'
