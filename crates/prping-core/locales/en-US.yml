  note_stack_reversed: 'note: %{inner} inside %{outer}: application layer should only carry raw payload — layer order likely reversed'
  note_stack_transport_in_transport: 'note: %{inner} inside %{outer}: transport layer cannot directly carry another transport layer'
  note_stack_missing_network: 'note: %{inner} inside %{outer}: missing network layer (ipv4/ipv6) — link layer cannot directly carry transport/application/ICMP'
  note_stack_payload_only: 'note: %{inner} inside %{outer}: ICMP/ARP should only carry raw payload'
  note_stack_uninferrable_proto: 'note: %{inner} inside %{outer}: cannot infer protocol number (proto=0 / next_header=59) — set it explicitly or add a transport layer'
  note_stack_wrong_carrier: 'note: %{inner} declares carrier %{carriers} (via #[rule]) but is wrapped in %{outer}'
  err_no_packets: 'no packets to send: file has no default or named exports'
  err_all_bare: 'no packets to send: all %{total} export(s) are bare layers (no TCP/UDP transport, no eth/ipv4/ipv6 outer layer)'
  err_send_failed: '%{failed} of %{total} packets failed to send'
errors:
  # Privilege hints (conditionally compiled per platform, appended to every
  # raw-socket / packet-capture permission failure)
  priv_hint_linux: 'run with `sudo`, grant cap_net_raw'
  priv_hint_windows: 'run as administrator'
  priv_hint_macos: 'run with `sudo`, or install Wireshark ChmodBPF to authorize /dev/bpf*'
  priv_hint_other: 'requires root privileges'
  raw_socket: 'raw socket: %{error} (%{hint})'
  raw_socket_windows: 'cannot create raw socket: %{error}. Windows raw sockets require administrator privileges (%{hint}) and are broken on Windows 7 RTM (SP0) (WSAEINVAL 10022) — ICMP ping uses the ICMP API instead, but the MTU probe / ICMP traceroute may be unavailable here'
  raw_socket_macos: 'cannot create raw socket: %{error} (%{hint})'
  af_packet_socket: 'AF_PACKET: %{error} (%{hint})'
  raw_icmp_wait: 'raw ICMP: %{error} (%{hint})'
  pcap_open: 'failed to open %{platform} device `%{dev}`: %{error} (%{hint})'
  capture_promisc_failed: 'note: could not enable promiscuous mode (needs CAP_NET_ADMIN) — only local/broadcast/multicast frames are captured'
  no_npcap: 'Npcap is not installed (wpcap.dll not found) — packet --raw needs Npcap (https://npcap.com); all other prping features work without it'
  cannot_resolve: 'cannot resolve host: %{host}'
  invalid_bind: 'invalid bind address: %{addr}. Format: host:port'
  host_port_required: HOST[:PORT] required
  conflict_eng_pkg: "--eng and --pkt are mutually exclusive"
  lsp_requires_eng: "--lsp only applies with --eng"
  raw_requires_pkg: "--raw only applies with --pkt"
  iface_requires_raw: "--iface only applies with --pkt --raw"
  listen_conflict: "continuous listen (bare --wait) cannot be combined with --fuzz/--out (receives and prints match details; --raw = link-layer listen, pairs with --iface)"
  params_requires_eng_pkg: "--params only applies with --eng or --pkt"
  params_format: "--params expects k=v format: `%{value}`"
  global_requires_eng_pkg: "--global only applies with --eng or --pkt"
  global_format: "--global expects k=v format: `%{value}`"
  wait_requires_pkg: "--wait only applies with --pkt"
  fuzz_requires_pkg: "--fuzz only applies with --pkt"
  out_requires_pkg: "--out only applies with --pkt"
  eng_sub_conflict: "--ls / --hex / --pcap are mutually exclusive"
  eng_sub_requires_eng: "--ls / --hex / --pcap only apply with --eng"
  eng_sub_conflict_lsp: "--ls / --hex / --pcap cannot be combined with --lsp"
  eng_sub_no_file: "--ls / --hex / --pcap do not take a file argument"
  eng_json_sub_conflict: "--json is only valid for FILE.pkt/.pktl analysis (cannot combine with --ls/--hex/--pcap/--lsp)"
  pkt_json_listen_conflict: "--json cannot be combined with continuous listen (bare --wait)"
  conflict_engine_mode: "%{flag} cannot be combined with: %{opts}"
  eng_requires_file: "--eng needs a .pkt file to analyze (or --eng --lsp)"
  eng_lsp_no_file: "--lsp does not take a file argument"
  pkg_requires_target: "--pkt needs a HOST:PORT target"
  pkg_requires_port: "--pkt needs a target port (HOST:PORT). Hint: if this recipe has no TCP/UDP layer (e.g. ICMP/ARP), add --raw: prping packet FILE HOST --raw"
  udp_requires_port: 'UDP requires a port: HOST:PORT'
  bandwidth_requires_port: bandwidth requires HOST:PORT
  invalid_count: 'invalid count value: %{value} (use N or Ns)'
  invalid_histogram: 'invalid histogram value: %{value} (use N or t1,t2,...)'
  udp_size_clamped: UDP payload clamped to %{max} bytes (requested %{size})
  interval_min: interval clamped to minimum 1ms (requested %{value}s)
  parallel_udp_ignored: "--parallel ignored in UDP mode (UDP bandwidth is single-connection)"
  parallel_ignored: "--parallel ignored in this mode (bandwidth test only)"
  receive_ignored_ping: "-r ignored for plain ping (use -l for latency or -b for bandwidth)"
  invalid_ipv6: 'invalid IPv6 format: [host] or [host]:port'
  conflict_source_server: "-s (--source) cannot be used with server mode"
  conflict_source_engine: "-s (--source) cannot be used with engine/package modes (--eng/--pkt)"
  mtu_ipv4_only: MTU probe supports IPv4 only (IPv6 path MTU needs ICMPv6 Packet Too Big, not yet supported)
  mtu_no_reply: 'no reply: ICMP may be dropped by a firewall (%{target})'
  conflict_mtu_mode: "--mtu cannot be combined with: %{opts}"
  mtu_requires_no_port: 'MTU probe does not take a port: prping ping -m HOST'
  conflict_mtu_histogram: "--mtu does not support -H histogram"
  conflict_trace_mode: "-t cannot be combined with: %{opts}"
  trace_requires_no_port: 'UDP traceroute does not take a port: prping trace --udp HOST (destination ports auto-increment from 33434)'
  tcp_trace_requires_port: 'TCP traceroute requires a port: prping trace HOST:PORT'
  trace_udp_tcp_conflict: "TCP and UDP traceroute cannot be requested together"
  tcp_trace_npcap: 'TCP traceroute on Windows requires Npcap (wpcap.dll not found) — install Npcap from https://npcap.com and retry, or use ICMP traceroute (prping trace HOST)'
  tcp_trace_ipv6: 'TCP traceroute on Windows (Npcap path) supports IPv4 only — IPv6 targets need ND neighbor resolution; use ICMP traceroute instead (prping trace HOST)'
  raw_eth_macos: '--raw sending Ethernet frames (eth) on macOS requires libpcap with root or ChmodBPF authorization — run with sudo, or use packets without an eth layer (ipv4/ipv6 outer layer works fine)'
  trace_no_local_addr: cannot determine the local source address (UDP route probe failed)
  max_hops_requires_trace: "-m only applies with trace (traceroute)"
  no_dns_requires_trace: "-d only applies with trace (traceroute)"
  resolve_failed: cannot resolve %{host}
  engine_mode_required: 'no mode given: use --eng / --pkt / --ls / --hex / --pcap'
  help_pkg_not_found: |-
    no manual section matches "%{section}"
    use `prping document` to list the table of contents:
  help_pkg_ambiguous: "%{count} sections match; use the number or a more specific title:"
  help_pkg_toc_hint: 'table of contents (use `prping document <number-or-title>` to jump):'
  conflict_v4_v6: "-4 and -6 cannot be used together"
  conflict_server_target: "-s (server mode) cannot be combined with a target HOST[:PORT]"
  conflict_server_mode: "-s (server mode) cannot be combined with client test options: %{opts}"
  conflict_json_pretty: "--json and -p/--pretty cannot be used together"
  conflict_json_graph: "--json and -g/--graph cannot be used together"
  conflict_json_histogram: "--json and -H/--histogram cannot be used together"
  receive_requires_latency_bandwidth: "-r requires -b (bandwidth) or -l (latency) with HOST:PORT"
  lib_requires_eng_pkg: "--lib requires --eng or --pkt"
  ambiguous_prefix: "ambiguous subcommand prefix '%{token}': matches %{candidates}"
  legacy_host_hint: "unrecognized subcommand '%{host}' — prping now uses subcommands; try: prping ping %{host} (migration guide: prping document)"
  latency_requires_port: latency requires HOST:PORT
cmd:
  ping: Ping a host (ICMP; TCP with a port, UDP with -u, MTU probe with -m)
  latency: Latency test (echo round-trip over TCP/UDP)
  bandwidth: Bandwidth test (TCP/UDP throughput)
  server: Run the test server (serves latency/bandwidth clients)
  trace: 'Traceroute (ICMP echo; TCP SYN when a port is given, UDP with -u)'
  engine: 'Packet engine: analyze .pkt/.pktl, LSP, --ls/--hex/--pcap'
  packet: Build packets from a .pkt/.pktl file and send
help:
  group:
    mode: Mode (auto-detected)
    test: Test control
    output: Output
    network: Network
    server: Server
    other: Other
    engine: Engine / packet build
  options:
    server: Server listening address and port
    bandwidth: Bandwidth test mode
    count: 'Number of sends/receives (default: infinite). Append ''s'' for seconds e.g. ''10s'''
    interval: Interval in seconds (default 1, 0 = fast ping)
    size: Request/payload size (e.g. 64, 8k, 1m). Triggers latency test when port present.
    lang: 'Set language (e.g. en-US, zh-CN). Default: auto-detect from system.'
    udp: UDP mode (default is TCP)
    mtu: Probe path MTU via ICMP DF + binary search
    traceroute: 'Traceroute: ICMP echo with increasing TTL, hop-by-hop path discovery'
    trace_udp: 'UDP traceroute (classic: destination ports start at 33434; Port Unreachable from the target means reached)'
    max_hops: 'Maximum hops (default 30)'
    no_dns: 'Skip reverse DNS lookup'
    eng: 'Engine mode: analyze a .pkt file with rich output (add --lsp for a language server)'
    lsp: Start a Language Server for .pkt files (with --eng; JSON-RPC over stdio)
    pkg: >-
      Build packets from a .pkt file and send to HOST:PORT (optional; derived from packet dst/dport when omitted, add --raw
      for raw sockets)
    raw: 'Send full serialized packets via raw sockets (Linux: root/cap_net_raw; Windows: Npcap installed, run as admin; macOS: root/ChmodBPF)'
    iface: 'Network interface for raw ethernet frames (default: lo)'
    params: Runtime parameters for the .pkt script (-p k=v,k2=v2; read via params("name") in the script)
    global: >-
      Recipe globals injected into the global store (k=v,k2=v2; read via global("name") in the
      script; with a .pktl recipe this seeds global: declarations, -g overrides init)
    wait: Wait up to SECS for a matching reply (like scapy sr1), print RTT and dissect it (with --pkt)
    listen: 'listen mode: match incoming UDP datagrams against the .pkt sniffer rule and print match details (pure listen; responses are orchestrated by a .pktl recipe; HOST:PORT is the listen address, derived from the packet dport when omitted)'
    fuzz: Randomize all unset fields before sending (like scapy fuzz(), with --pkt)
    out: Save built packets to a pcap file (like scapy wrpcap, with --pkt)
    ls: List all builtin layer functions with fields and auto behavior (with --eng)
    hex: Dissect and show raw bytes from a hex string (with --eng)
    pcap: Read a pcap file and dissect every record (with --eng)
    quiet: Suppress per-ping output
    histogram: 'Histogram: bucket count (e.g. 20) or comma-separated thresholds in ms (e.g. 1,5,10,50)'
    warmup: Warmup iterations (default 4)
    parallel: Number of parallel connections (default 1)
    v4: Force IPv4
    v6: Force IPv6
    source: Source address or interface (Linux iface name → IPv4)
    json: Output machine-readable JSON statistics
    receive: Receive from server instead of sending (download direction; used with -l latency or -b bandwidth)
    pretty: Render graphs with ploot (Unicode/Braille)
    graph: Print latency timeline graph (combine with -p for ploot rendering)
    version: Show version
    help_pkg: Full manual (paged); document SECTION jumps to a chapter (number or title)
  usage_ping: 'prping ping [OPTIONS] <HOST[:PORT]>'
  usage_latency: 'prping latency [OPTIONS] <HOST:PORT>'
  usage_bandwidth: 'prping bandwidth [OPTIONS] <HOST:PORT>'
  usage_server: 'prping server <ADDR:PORT>'
  usage_trace: 'prping trace [OPTIONS] <HOST[:PORT]>'
  usage_engine: 'prping engine [OPTIONS] [<FILE.pkt>]'
  usage_packet: 'prping packet [OPTIONS] <FILE.pkt> [<HOST[:PORT]>]'
  footer_ping: |-
    Examples:
      prping ping 8.8.8.8                  ICMP ping (infinite)
      prping ping 192.168.1.1:22           TCP ping
      prping ping -u 192.168.1.1:53        UDP ping
      prping ping -m 8.8.8.8               MTU probe
  footer_latency: |-
    Examples:
      prping latency 192.168.1.1:9000
      prping latency -u -r 192.168.1.1:9000   UDP download latency
  footer_bandwidth: |-
    Examples:
      prping bandwidth -l 8k --parallel 4 192.168.1.1:9000
      prping bandwidth -u -r 192.168.1.1:9000  UDP download throughput
  footer_server: |-
    Example:
      prping server 0.0.0.0:9000
  footer_trace: |-
    Examples:
      prping trace 8.8.8.8                   ICMP echo traceroute
      prping trace -m 60 8.8.8.8
      prping trace 8.8.8.8:443               TCP SYN traceroute (auto with a port, works when ICMP is filtered)
      prping trace --udp 8.8.8.8             UDP traceroute (classic, ports start at 33434)
  footer_engine: |-
    Examples:
      prping engine file.pkt        analyze a packet script
      prping engine --lsp           language server
      prping engine --ls            list builtins
  footer_packet: |-
    Examples:
      prping packet file.pkt 192.168.1.1:9000
      prping packet --raw --wait 2 file.pkt 8.8.8.8
      prping packet arp_request.pkt --raw   # 链路层帧（ARP 等）：目标可省略
      prping packet arp_request.pkt --raw   # link-layer frame (ARP etc.): target optional
      prping packet --wait server.pkt 127.0.0.1:5353      # bare --wait: continuous listen, match and print details
  overview: |-
    prping — ping, latency, bandwidth measurement utility

    Subcommands: ping (ICMP/TCP/UDP/MTU probe), latency, bandwidth,
    server, trace (traceroute), engine (packet analysis) and packet.
  usage: 'prping COMMAND [OPTIONS] ...   (prping document for the full manual)'
  mode_guide: |-
    Subcommands can be abbreviated to any unique prefix (e.g. `prping e FILE.pkt` → engine).
    Detailed help: `prping COMMAND --help` — full manual: `prping document`.
  usage_line: |-
    Help: prping COMMAND --help   (prping --help lists all commands)
       ping        ICMP ping / TCP ping (port) / UDP ping (-u) / MTU probe (-m)
       latency     Echo round-trip latency over TCP/UDP
       bandwidth   Throughput test over TCP/UDP
       server      Run the test server (serves latency/bandwidth)
       trace       Traceroute (ICMP echo + increasing TTL)
       engine      Packet engine: analyze .pkt/.pktl, LSP, --ls/--hex/--pcap
       packet      Build packets from a .pkt/.pktl file and send
    Examples:
      prping ping 8.8.8.8                      ICMP ping (infinite)
      prping ping -n 10 -gp 8.8.8.8            ICMP, 10 pings, ploot graph
      prping ping 192.168.1.1:22               TCP ping
      prping ping -u 8.8.8.8:53                UDP ping
      prping ping -m 8.8.8.8                   MTU probe
      prping latency -l 64 -n 100 server:8080   Latency test (TCP, 64 bytes)
      prping bandwidth -l 8k -n 10000 --parallel 4 server:8080  Bandwidth (TCP, 8KB, 4 conns)
      prping bandwidth -l 8k -n 10s -u -r server:8080   Bandwidth (UDP download, 10s)
      prping server 0.0.0.0:8080               Start server
      prping trace 8.8.8.8                     Traceroute
      prping engine file.pkt                   Analyze a packet script
      prping packet file.pkt 192.168.1.1:9000  Build and send packets

