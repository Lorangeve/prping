cmd:
  ping: 主机 ping（ICMP；带端口为 TCP，-u 为 UDP，-m 为 MTU 探测）
  latency: 延迟测试（TCP/UDP 回显往返）
  bandwidth: 带宽测试（TCP/UDP 吞吐）
  server: 启动测试服务端（服务 latency/bandwidth 客户端）
  trace: 路由跟踪（ICMP echo；带端口自动 TCP SYN，-u 用 UDP）
  engine: 包引擎：分析 .pkt/.pktl、LSP、--ls/--hex/--pcap
  packet: 从 .pkt/.pktl 文件构建并发送网络包
help:
  group:
    mode: 模式（自动识别）
    test: 测试控制
    output: 输出
    network: 网络
    server: 服务端
    other: 其他
    engine: 引擎 / 包构建
  options:
    server: 服务端监听地址和端口
    bandwidth: 带宽测试模式
    count: 发送/接收次数（默认无限）。追加 's' 表示秒数（如 '10s'）
    interval: 间隔秒数（默认 1，0 = 快速 ping）
    size: 请求/负载大小（如 64, 8k, 1m）。有端口时触发延迟测试。
    lang: 设置语言（如 en-US, zh-CN）。默认从系统自动检测。
    udp: UDP 模式（默认 TCP）
    mtu: MTU 探测：ICMP DF + 变长载荷二分
    traceroute: 路由跟踪（traceroute）：ICMP echo + 递增 TTL 逐跳探测路径
    trace_udp: UDP 路由跟踪（经典 traceroute：33434 起递增端口；目标回端口不可达即到达）
    max_hops: 最大跳数（默认 30）
    no_dns: 跳过反向 DNS 解析
    eng: 引擎模式：分析 .pkt 文件并精美输出（加 --lsp 启动语言服务器）
    lsp: 为 .pkt 文件启动 LSP 语言服务器（配合 --eng；JSON-RPC over stdio）
    pkg: 从 .pkt 文件构建网络包并发送到 HOST:PORT（可省略，省略时按包内 dst/dport 推导；加 --raw 用原始套接字）
    raw: 用原始套接字发送完整序列化包（Linux 需 root/cap_net_raw；Windows 需安装 Npcap 并以管理员运行；macOS 需 root/ChmodBPF）
    iface: 原始以太网帧使用的网卡（默认 lo）
    params: 传给 .pkt 脚本的运行时参数（-p k=v,k2=v2；脚本内用 params("name") 读取）
    global: >-
      注入配方全局存储的键值（k=v,k2=v2；脚本内用 global("name") 读取；配合 .pktl
      配方时作为 global: 声明的初始值，-g 覆盖 init）
    wait: 发送后等待最多 SECS 秒的匹配应答（对标 scapy sr1），打印 RTT 并反解展示（配合 --pkt）
    listen: '监听模式：按 .pkt 的 sniffer 规则匹配收到的 UDP 数据报并回显（pktlang 对话的服务端；HOST:PORT 为监听地址，省略时按包内 dport 推导）'
    fuzz: 发送前把未填字段全部随机化（对标 scapy fuzz()，配合 --pkt）
    out: 把构建的包存成 pcap 文件（对标 scapy wrpcap，配合 --pkt）
    ls: 列出全部内置层函数的字段表与自动行为（配合 --eng）
    hex: 反解并展示十六进制字符串对应的包（配合 --eng）
    pcap: 读取 pcap 文件并逐条反解展示（配合 --eng）
    quiet: 不输出每次测试结果
    histogram: '直方图: 桶数（如 20）或逗号分隔的毫秒阈值（如 1,5,10,50）'
    warmup: 预热迭代次数（默认 4）
    parallel: 并发连接数（默认 1）
    v4: 强制使用 IPv4
    v6: 强制使用 IPv6
    source: 源地址或网卡（Linux 网卡名 → IPv4 地址）
    json: 输出机器可读的 JSON 统计
    receive: 接收模式：测下载方向（配合 -l 延迟或 -b 带宽测试使用）
    pretty: 用 ploot 渲染图表（Unicode/Braille）
    graph: 显示延迟时间线图（配合 -p 用 ploot 渲染）
    version: 显示版本号
    help_pkg: 使用手册（分页）；document 章节标题 跳转（编号或标题）
  usage_ping: 'prping ping [选项] <HOST[:PORT]>'
  usage_latency: 'prping latency [选项] <HOST:PORT>'
  usage_bandwidth: 'prping bandwidth [选项] <HOST:PORT>'
  usage_server: 'prping server <ADDR:PORT>'
  usage_trace: 'prping trace [选项] <HOST[:PORT]>'
  usage_engine: 'prping engine [选项] [<FILE.pkt>]'
  usage_packet: 'prping packet [选项] <FILE.pkt> [<HOST[:PORT]>]'
  footer_ping: |-
    示例:
      prping ping 8.8.8.8                  ICMP ping（无限）
      prping ping 192.168.1.1:22           TCP ping
      prping ping -u 192.168.1.1:53        UDP ping
      prping ping -m 8.8.8.8               MTU 探测
  footer_latency: |-
    示例:
      prping latency 192.168.1.1:9000
      prping latency -u -r 192.168.1.1:9000   UDP 下行延迟
  footer_bandwidth: |-
    示例:
      prping bandwidth -l 8k --parallel 4 192.168.1.1:9000
      prping bandwidth -u -r 192.168.1.1:9000  UDP 下行吞吐
  footer_server: |-
    示例:
      prping server 0.0.0.0:9000
  footer_trace: |-
    示例:
      prping trace 8.8.8.8                   ICMP echo 路由跟踪
      prping trace -m 60 8.8.8.8
      prping trace 8.8.8.8:443               TCP SYN 路由跟踪（带端口自动启用，ICMP 被过滤时可用）
      prping trace --udp 8.8.8.8             UDP 路由跟踪（经典 traceroute，33434 起递增端口）
  footer_engine: |-
    示例:
      prping engine file.pkt        分析包脚本
      prping engine --lsp           语言服务器
      prping engine --ls            列出内置原语
  footer_packet: |-
    示例:
      prping packet file.pkt 192.168.1.1:9000
      prping packet --raw --wait 2 file.pkt 8.8.8.8
      prping packet arp_request.pkt --raw   # 链路层帧（ARP 等）：目标可省略
      prping packet --wait server.pkt 127.0.0.1:5353      # 裸 --wait：持续监听并按 sniffer 规则回显
      prping packet arp_request.pkt --raw   # link-layer frame (ARP etc.): target optional
  overview: |-
    prping — ping, 延迟, 带宽测量工具

    子命令: ping（ICMP/TCP/UDP/MTU 探测）、latency（延迟）、bandwidth（带宽）、
    server（服务端）、trace（路由跟踪）、engine（包分析）与 packet（发包）。
  usage: 'prping 子命令 [选项] ...   （完整手册: prping document）'
  mode_guide: |-
    子命令可用任意唯一前缀缩写（如 `prping e FILE.pkt` → engine）。
    详细用法: `prping 子命令 --help` — 完整手册: `prping document`。
  usage_line: |-
    帮助: prping 子命令 --help   （prping --help 列出全部子命令）
       ping        ICMP ping / TCP ping（带端口）/ UDP ping（-u）/ MTU 探测（-M）
       latency     回显往返延迟测试（TCP/UDP）
       bandwidth   TCP/UDP 吞吐测试
       server      启动测试服务端（服务 latency/bandwidth）
       trace       路由跟踪（ICMP echo + 递增 TTL）
       engine      包引擎：分析 .pkt/.pktl、LSP、--ls/--hex/--pcap
       packet      从 .pkt/.pktl 构建并发送网络包
    示例:
      prping ping 8.8.8.8                      ICMP ping（无限）
      prping ping -n 10 -gp 8.8.8.8            ICMP，10 次，ploot 图
      prping ping 192.168.1.1:22               TCP ping
      prping ping -u 8.8.8.8:53                UDP ping
      prping ping -m 8.8.8.8                   MTU 探测
      prping latency -l 64 -n 100 server:8080  延迟测试（TCP，64 字节）
      prping bandwidth -l 8k -n 10000 --parallel 4 server:8080  带宽（TCP，8KB，4 并发）
      prping bandwidth -l 8k -n 10s -u -r server:8080  带宽（UDP 下行，10 秒）
      prping server 0.0.0.0:8080              启动服务端
      prping trace 8.8.8.8                    路由跟踪
      prping engine file.pkt                  分析包脚本
      prping packet file.pkt 192.168.1.1:9000 构建并发送网络包

