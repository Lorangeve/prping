[package]
name = "prping-core"
version = "0.1.0"
edition = "2024"
description = "prping 核心库：跨平台 psping 复刻（协议实现 + 包构造引擎）"
license = "MIT"

[features]
# Linux 可选 libpcap 支持：启用后 `packet --raw` 走 pcap 链路层注入（替代
# AF_PACKET / IPPROTO_RAW），且 `server -v` 抓包改走与 Windows/macOS 完全一致
# 的 pcap 多设备路径（启动行显示真实接口名列表，而非 AF_PACKET 的「全接口」）。
# 需系统安装 libpcap-dev。默认不启用——Linux 原生 raw socket 无需额外依赖。
pcap = ["dep:pcap"]

# Web 编辑器服务器（`prping web`：serve_web/WebConfig）。**默认不启用**——
# 关闭时整个 web 模块不编译、CLI 无 web 子命令（产物体积更小）。启用只需
# `--features prping/web`（整 workspace 统一由 justfile 的 build/check/test
# 配方启用）。web 模块仅用已有 crate（smol/termcolor/anyhow/async-tungstenite/
# open/futures-util/mime_guess/serde_json），无新增依赖；运行期从二进制目录/
# 启动目录的 `UI/` 文件夹读取前端产物。
web = []

# Web 前端资源内嵌（rust-embed）：release 编译期内嵌 frontend/dist 进二进制
# （单文件分发），debug 运行期直读磁盘（改前端重跑构建即生效）。默认不启用——
# 运行期从二进制目录/启动目录的 `UI/` 文件夹读取前端产物（just build-web 生成），
# 产物体积小、构建无需 node 工具链。隐含启用 `web`（内嵌只对 web 子命令有意义）。
web-embed = ["dep:rust-embed", "web"]

[dependencies]
smol = "2"
anyhow = "1"
termcolor = "1"
socket2 = { version = "0.6", features = ["all"] }
rust-i18n = "3"
libc = "0.2"
thiserror = "2"
ploot = "0.1"
packet-dsl = { path = "../packet-dsl" }
serde_json = "1"
async-tungstenite = "0.35.0"
rust-embed = { version = "8.12.0", optional = true }
open = "5.4.2"
futures-util = { version = "0.3.34", default-features = false }
mime_guess = "2.0.5"

[dev-dependencies]
serde_json = "1"
# 测试构建时为 packet-dsl 开 `test-stdlib`：default_libs 运行时发现落空时回退
# 仓库 eng_lib（core 测试的 exe 在 target/*/deps、cwd 在 crate 目录，都没有 lib/）。
# 产物编译走 [dependencies] 同名条目（不带该 feature），运行时只认 lib/ 布局。
packet-dsl = { path = "../packet-dsl", features = ["test-stdlib"] }

# pcap 依赖：Windows/macOS 始终编译；Linux 通过 `--features pcap` 可选启用。
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
pcap = "2"
[target.'cfg(target_os = "linux")'.dependencies]
pcap = { version = "2", optional = true }

# Windows 平台依赖（WinAPI 类型定义，用于 reverse_dns 等）
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Networking_WinSock",
    "Win32_Networking",
    "Win32_NetworkManagement_IpHelper",
    # GetAdaptersAddresses / IP_ADAPTER_ADDRESSES_LH（serve 抓包枚举本机 IP 用）
    "Win32_NetworkManagement_Ndis",
    "Win32_Foundation",
    # IcmpSendEcho2 / Icmp6SendEcho2 声明带 `feature = "Win32_System_IO"` 门控
    # （apcroutine 参数类型 PIO_APC_ROUTINE 来自 Win32::System::IO）
    "Win32_System_IO",
]}
