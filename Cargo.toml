[package]
name = "prping"
version = "0.1.0"
edition = "2024"

[lib]
name = "prping"
path = "src/lib.rs"

[workspace]
members = ["packet-dsl"]
resolver = "3"

[dependencies]
smol = "2"
bpaf = "0.9"
anyhow = "1"
termcolor = "1"
socket2 = { version = "0.6", features = ["all"] }
rust-i18n = "3"
libc = "0.2"
thiserror = "2"
ploot = "0.1"
packet-dsl = { path = "packet-dsl" }
serde_json = "1"

# Windows raw 发送兼容层（--pkg --raw）：Npcap 的 wpcap.dll 绑定（仅 Windows 目标拉取）
[target.'cfg(windows)'.dependencies]
pcap = "2"
