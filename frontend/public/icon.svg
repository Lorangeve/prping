<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#0e1a30"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- 底板 -->
  <rect x="2" y="2" width="124" height="124" rx="26" fill="url(#bg)"/>
  <rect x="2" y="2" width="124" height="124" rx="26" fill="none" stroke="#22d3ee" stroke-opacity="0.25" stroke-width="1.5"/>

  <!-- 背景网格 -->
  <g stroke="#38bdf8" stroke-opacity="0.08" stroke-width="1">
    <path d="M2 30h124M2 58h124M2 86h124"/>
    <path d="M30 2v124M58 2v124M86 2v124M114 2v124"/>
  </g>

  <!-- 上半：目标雷达 -->
  <path d="M64 44 L64 18 A26 26 0 0 1 82.4 25.6 Z" fill="url(#sweep)"/>
  <g fill="none" stroke="url(#neon)" stroke-width="2">
    <circle cx="64" cy="44" r="26" stroke-opacity="0.3"/>
    <circle cx="64" cy="44" r="17" stroke-opacity="0.55" stroke-dasharray="5 4"/>
    <circle cx="64" cy="44" r="8" stroke-opacity="0.9"/>
  </g>
  <g stroke="#7dd3fc" stroke-width="2" stroke-linecap="round">
    <path d="M64 12v6M64 70v6M32 44h6M90 44h6"/>
  </g>
  <g fill="#a5f3fc" filter="url(#glow)">
    <circle cx="64" cy="44" r="3.5" fill="#e0fdff"/>
    <circle cx="78" cy="55" r="2.5"/>
    <circle cx="50" cy="32" r="2" fill-opacity="0.8"/>
  </g>

  <!-- 中部：ICMP 延迟回波波形 -->
  <path d="M16 82 H42 L48 68 L54 94 L60 74 L66 82 H112"
        fill="none" stroke="url(#neon)" stroke-width="2.5"
        stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <!-- 基线 -->
  <path d="M16 82 H112" stroke="#38bdf8" stroke-opacity="0.2" stroke-width="1"/>

  <!-- 底部：prping 字标 + 终端光标 -->
  <text x="34" y="112" font-family="'JetBrains Mono','Fira Mono','DejaVu Sans Mono','Courier New',monospace"
        font-size="17" font-weight="700" fill="url(#neon)" letter-spacing="1.5">prping</text>
  <rect x="105" y="100" width="8" height="13" rx="1" fill="#22d3ee" fill-opacity="0.9" filter="url(#glow)"/>
</svg>
